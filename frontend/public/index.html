<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="ICE Site Ops: daily reports, schedules and field records for construction projects." />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <!-- manifest.json provides PWA install metadata. -->
        <!-- Typography (2026-05-18): Inter is SELF-HOSTED — the woff2
             files live in src/fonts/inter/ and are @font-face'd in
             src/index.css (webpack bundles them into the app).
             Red-Noir skin (2026-05-22): adds Atkinson Hyperlegible
             (low-vision optimized, Braille Institute), Manrope
             (display), and JetBrains Mono (data/codes) via Google
             Fonts CDN. If CSP / preview-env blocks the CDN, the
             stack falls back to the self-hosted Inter — body still
             renders fine, just without the brand display font. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@200;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        -->
        <title>SiteOps — Federal Construction OS</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
